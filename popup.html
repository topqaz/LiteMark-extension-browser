<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteMark 书签导入</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔖 LiteMark 导入</h1>
    </header>

    <!-- 配置区域 -->
    <section id="config-section" class="section">
      <h2>配置</h2>
      <div class="form-group">
        <label for="api-url">LiteMark API 地址：</label>
        <input type="text" id="api-url" placeholder="https://your-litemark.app" />
        <small>输入你的 LiteMark 部署地址</small>
      </div>
      <div class="form-group">
        <label for="username">用户名：</label>
        <input type="text" id="username" placeholder="admin" />
      </div>
      <div class="form-group">
        <label for="password">密码：</label>
        <input type="password" id="password" placeholder="admin123" />
      </div>
      <button id="save-config" type="button" class="btn btn-primary">保存配置</button>
    </section>

    <!-- 使用说明区域 -->
    <section id="info-section" class="section" style="display: none;">
      <h2>使用说明</h2>
      <div class="info-content">
        <p>✅ 配置已完成！现在可以使用以下方式添加书签：</p>
        <ol>
          <li><strong>右键菜单</strong>：在任意网页右键，选择"添加到 LiteMark" → 选择分类（或无分类）</li>
          <li><strong>链接添加</strong>：右键点击链接，选择"添加到 LiteMark" → 选择分类</li>
          <li><strong>标题获取方式</strong>：
            <ul>
              <li>如果选中了文本，会使用选中文本作为书签标题</li>
              <li>如果没有选中文本，会使用网站标题（页面 title）</li>
            </ul>
          </li>
        </ol>
        <p class="tip">💡 提示：分类菜单会自动从 LiteMark 中加载，新添加的分类会在下次右键时显示</p>
      </div>
      <div id="status" class="status"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
