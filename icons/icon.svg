<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)"/>
  
  <!-- 书签图标 -->
  <path d="M 32 20 L 32 100 L 64 80 L 96 100 L 96 20 Z" fill="white" opacity="0.95"/>
  
  <!-- 内部装饰线 -->
  <line x1="64" y1="20" x2="64" y2="80" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 小星星装饰 -->
  <circle cx="48" cy="40" r="3" fill="#764ba2"/>
  <circle cx="80" cy="50" r="2.5" fill="#764ba2"/>
</svg>

